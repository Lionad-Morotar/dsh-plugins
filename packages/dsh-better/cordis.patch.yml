# Loader row for the browser half. The host half is a no-op row that exists so
# this package loads on both surfaces; the feature lives in `dsh.client`.
- insert:
    - id: better
      name: 'dsh-better'

# Team 配置不随本 bundle 覆盖。
# 0.2.2-rc.2 起 AgentTeam 复用统一子代理，agent-team 行拒绝 maxMembers /
# maxMessageBytes / disposalTimeoutMs（TeamService 构造时抛 TEAM_INVALID_CONFIG），
# 旧宿主（0.2.2-rc.1 及更早）仍认这三个键。同一份 bundle patch 要同时兼容两种宿主，
# 所以这里不写任何 Team 配置；需要旧宿主更大成员上限的 profile，请在该 profile 自己的
# cordis.patch.yml 里写旧键，并在升级 0.2.2-rc.2 前删除。
